name: refresh pin cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # 6am eastern in summer, 5am in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: generate cards
        run: python3 generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --staged || git commit -m "refresh pin cards"
          git push
