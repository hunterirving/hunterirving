name: refresh pin cards

on:
  push:
    branches: [main]
  schedule:
    # cron is UTC and has no DST, so both candidate hours run and the gate drops one
    - cron: "0 10 * * *" # 6am America/New_York while EDT
    - cron: "0 11 * * *" # 6am America/New_York while EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: is it 6am in new york
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "06" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "it is ${hour}:00 in New York, not 06:00 — skipping"
          fi

      - name: generate cards
        if: steps.gate.outputs.go == 'true'
        run: python3 generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --staged || git commit -m "refresh pin cards"
          git push
